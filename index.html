<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Cafeteria CatCafé</title>
</head>

<body>
    <header>
        <nav class="nav-barra">
            <a href="index.html"><img src="./assets/logo.png" alt="Logo do CatCafé" class="logo"></a>
            <ul class="nav-links">
                <li class="cardapio" ><a href="./paginas/cardapio.html">CARDÁPIO</a></li>
                <li class="garcom" ><a href="./paginas/login.html">ÁREA DO GARÇOM</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="bem-vindo-section">
            <div class="texto">
                <p class="hero-intro">Seja bem-vindo a um dos primeiros cat cafés de São Paulo.</p>
                <h1>Café que faz o coração ronronar!</h1>
                <div class="linha"></div>
            </div>
            <div class="bem-vindo-imagem">
                <img src="./assets/imagem-gatos.jpg" alt="Imagem de vários gatos em um café">
            </div>
        </section>
        <section class="opcoes-section">
            <h2>Como deseja continuar?</h2>
            <div class="opcoes-grid">
                <a href="./paginas/cardapio.html" class="opcao-card">
                    <div class="opcao-icon">
                        <img src="./assets/cafe-icon.png" alt="Ícone de cliente">
                    </div>
                    <h3>Cliente</h3>
                    <p>Faça seu pedido e aproveite nosso café na companhia dos gatinhos.</p>
                </a>
                <a href="./paginas/login.html" class="opcao-card">
                    <div class="opcao-icon">
                        <img src="./assets/user-icon.png" alt="Ícone de garçom">
                    </div>
                    <h3>Garçom</h3>
                    <p>Acesse o painel de pedidos e gerencie os atendimentos.</p>
                </a>
            </div>
        </section>
    </main>
</body>

</html>
