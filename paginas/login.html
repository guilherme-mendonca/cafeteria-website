<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../estilos/login.css">
    <title>Login Garçom</title> 
</head>
<body>
    <main>
        <section class="login-section">
            <div>
                <div class="cabecalho">
                    <button class="botao-voltar">
                        <img src="../assets/arrow-left.png" alt="seta">
                        <span>Voltar</span>
                    </button>
                    <a class="logo" href="../index.html">
                        <img class="logo" src="../assets/logo.png" alt="Logo do CatCafé">
                    </a>
                    <div class="titulo" >
                        <h1>Área do Garçom</h1>
                        <p>Digite sua senha para acessar</p>
                    </div>
                </div>

                <form action=""''>
                    <div class="email">
                        <label class="label" for="email">Email</label>
                        <img class="icone-email" src="../assets/email.png" alt="ícone de email">
                        <input class="caixa-de-texto" type="email" name="email" id="email" placeholder="Digite seu email">
                    </div>

                    <div class="senha">
                        <label class="label" for="senha">Senha</label>
                        <img class="icone-lock" src="../assets/lock.png" alt="ícone de cadeado">
                        <input class="caixa-de-texto" type="password" name="senha" id="senha" placeholder="Digite sua senha">
                        <button class="esqueci-senha">Esqueci minha senha</button>
                    </div>
                </form>
                
                <button class="botao-entrar">Entrar</button>
            </div>
        </section>
    </main>
</body>
</html>
