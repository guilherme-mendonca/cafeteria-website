<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../estilos/pedidos.css">
    <title>Pedidos</title>
</head>

<body>
    <header>
        <nav class="nav-barra">
            <a href="../index.html" class="nav-links botao-voltar">
                <img src="../assets/arrow-left.png" alt="Voltar">
                <span>Voltar</span>
            </a>
            <a href="../index.html" class="nav-links header-logo">
                <img src="../assets/logo.png" alt="Logo do Cat Café">
            </a>
        </nav>
    </header>

    <section>
        <div>
            <h1>Pedidos</h1>
            <span class="subtitulo">1 pedido(s) no sistema</span>
        </div>

        <div class="card-pedidos">
            <div class="gradiente">
                <div class="informacoes-pedido">
                    <div class="informacao">
                        <div class="cliente">
                            <h3 class="nome">Jeremias</h3>
                            <span class="mesa">Mesa 20</span>
                        </div>

                        <div class="detalhes-pedido">
                            <p class="pedido">Pedido #10234 11:25</p>
                        </div>
                    </div>

                    <div class="valor">
                        <p>R$ 22,50</p>
                    </div>
                </div>
            </div>

            <div class="itens">
                <h4>Itens do Pedido</h4>

                <div>
                    <div class="item">
                        <img src="../assets/latte.jpg" alt="Latte">
                        <div class="descricao">
                            <h5>Latte</h5>
                            <p>R$ 12,00</p>
                        </div>

                        <div class="quantidade-preco-total">
                            <p class="quantidade">1x</p>
                            <p class="preco">R$ 13,50</p>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="item">
                        <img src="../assets/croissant.jpg" alt="Croissant">
                        <div class="descricao">
                            <h5>Croissant</h5>
                            <p>R$ 9,00</p>
                        </div>

                        <div class="quantidade-preco-total">
                            <p class="quantidade">1x</p>
                            <p class="preco">R$ 9,00</p>
                        </div>
                    </div>
                </div>

                <div class="campo-status">
                    <div class="status">
                        <span>Pendente</span>
                    </div>

                    <input type="button" value="Marcar como Pronto" class="botao-pronto">
                </div>

            </div>
        </div>
        </div>

    </section>
</body>
</html>
